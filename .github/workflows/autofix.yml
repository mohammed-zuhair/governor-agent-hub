name: Self-Healing Auto-Fix

on:
  workflow_dispatch:

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Auto-Fix Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd orchestrator
          python autofix_agent.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "🤖 Auto-Fix: Resolved syntax error in sample_code.py"
          branch: auto-fix-branch
          title: "🛠️ Self-Healing: Syntax Error Fix"
          body: "This PR was automatically generated by the Swarm Auto-Fix Agent to resolve a syntax error."
