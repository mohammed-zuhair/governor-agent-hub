name: AI Evolution (Legislator)

on:
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Legislator Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd orchestrator
          python legislator_agent.py

      - name: Create Pull Request for New Law
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "🧬 Evolution: Proposed new AI law"
          branch: new-ai-law
          title: "🧬 AI Evolution: New Proposed Law"
          body: "This PR contains a new law proposed autonomously by the Legislator Agent to improve the repository. Review and merge if it makes sense!"
