name: Run Batch Agents

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        law_file: 
          - "law_001_json_syntax.yaml"
          - "law_002_yaml_syntax.yaml"
          - "law_003_markdown_length.yaml"
          - "law_004_general.yaml"
          - "law_005_general.yaml"
          - "law_006_general.yaml"
          - "law_007_general.yaml"
          - "law_008_general.yaml"
          - "law_009_general.yaml"
          - "law_010_general.yaml"
          - "law_011_general.yaml"
          - "law_012_general.yaml"
          - "law_013_general.yaml"
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Agent (${{ matrix.law_file }})
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd orchestrator
          python agent_runner.py ${{ matrix.law_file }}

  update-state:
    needs: run-agents
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aggregate State
        run: |
          cd orchestrator
          python aggregator.py
      - name: Commit and Push State
        run: |
          git config --global user.name 'Swarm Bot'
          git config --global user.email 'bot@swarm.local'
          git add ../state/STATE.json ../state/results/
          git commit -m "🧠 Memory: Updated STATE.json with latest agent results" || exit 0
          git push
